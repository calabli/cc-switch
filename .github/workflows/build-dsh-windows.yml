name: Build Harness usage Windows
on:
  workflow_dispatch:
  push:
    branches: ["codex/dsh-usage"]
permissions:
  contents: read
concurrency:
  group: harness-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Read Rust toolchain
        id: rust
        run: |
          $taskMatch = Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"'
          if (-not $taskMatch) { throw 'Rust version missing' }
          "channel=$($taskMatch.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
      - name: Install pinned pnpm
        run: npm install --global --force --no-audit --no-fund https://registry.npmjs.org/pnpm/-/pnpm-10.12.3.tgz
      - name: Locate pnpm store
        id: pnpm-store
        run: '"path=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT'
      - name: Cache pnpm packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node20-pnpm10-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node20-pnpm10-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Tauri's beforeBuildCommand builds dist exactly once, also needed by tests.
      - name: Build EXE and frontend
        run: pnpm tauri build --ci --no-bundle
      # Compile one test executable; run both filters directly so Cargo cannot rebuild it.
      - name: Compile usage tests once
        run: |
          $taskTestExe = cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib --no-run --message-format=json |
            ForEach-Object {
              if ($_ -match '^\{"reason":"compiler-artifact"') {
                $taskArtifact = $_ | ConvertFrom-Json
                if ($taskArtifact.executable -and $taskArtifact.profile.test -and $taskArtifact.target.name -eq 'cc_switch_lib') {
                  $taskArtifact.executable
                }
              }
            } | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $taskTestExe) { throw 'Usage test executable not found' }
          "USAGE_TEST_EXE=$taskTestExe" >> $env:GITHUB_ENV
      - name: Usage importer regression tests
        run: |
          & $env:USAGE_TEST_EXE session_usage_dsh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:USAGE_TEST_EXE session_usage_mcode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: cc-switch-dsh-minimax-windows-x64
          path: |
            src-tauri/target/release/cc-switch.exe
            LICENSE
          if-no-files-found: error
          retention-days: 14
