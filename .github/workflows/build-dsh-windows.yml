name: Build Harness usage (Windows + macOS)
on:
  workflow_dispatch:
  push:
    branches: ["codex/dsh-usage"]
permissions:
  contents: read
concurrency:
  group: harness-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # 回归测试单独一个 job，和构建并行跑。
  # 原来测试排在 release 构建前面串行，缓存命中后也要白等 3.5 分钟（主 crate 的
  # debug 编译）。拆开后墙钟从 test+build 变成 max(test, build)。
  # 这个 job 纯 Rust，不需要 node/pnpm：beforeBuildCommand 是 tauri CLI 负责的，
  # cargo test 不会调用它（run #3 验证过：dist/ 不存在也能跑通）。
  test:
    name: Usage importer regression tests
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read Rust toolchain
        id: rust
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      # rust-cache 把「已安装的所有 toolchain」的版本号和 commit 哈希一起算进缓存 key。
      # runner 镜像自带的那个 stable 一变（实测 1.99.1 → 1.99.0），key 就跟着变，
      # 缓存永远 miss，741 个依赖每次全量重编。仓库只锁了 rust-toolchain.toml 里
      # 的那一个版本，其余的都卸掉，key 才会稳定。
      - name: Keep only the pinned toolchain (stable cache key)
        shell: bash
        env:
          PINNED: ${{ steps.rust.outputs.channel }}
        run: |
          rustup toolchain list | awk '{print $1}' \
            | grep -E '^[A-Za-z0-9][A-Za-z0-9._-]*-[A-Za-z0-9._-]+$' \
            | while read -r tc; do
                case "$tc" in
                  # 锁定的 channel 可能以版本号形式装成 1.95.0-x86_64-…，也可能是
                  # 1.95-x86_64-… 或 stable-x86_64-…，三种都要认。
                  "$PINNED"|"$PINNED".*|"$PINNED"-*) echo "keep toolchain $tc" ;;
                  *) echo "removing toolchain $tc"; rustup toolchain uninstall "$tc" || true ;;
                esac
              done
          rustup toolchain list
          rustup default
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
      # 一次编译跑完所有 session_usage_* 模块的测试：过滤串 session_usage_ 同时覆盖
      # session_usage_dsh / session_usage_mcode（原来分两条命令，各编一遍主 crate），
      # 也顺带覆盖 agy/codex/gemini/grokbuild/kimi/opencode/pi 这些模块。
      # 不加 --release：上游 ci.yml 的 nextest ci profile 用的就是 debug profile，
      # 而这几个测试本身只跑 0.02 秒，release 编译纯属浪费十几分钟。
      - name: Run usage importer tests
        shell: bash
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib session_usage_

  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Read Rust toolchain
        id: rust
        run: |
          $taskMatch = Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"'
          if (-not $taskMatch) { throw 'Rust version missing' }
          "channel=$($taskMatch.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      # 同上：只留锁定的 toolchain，rust-cache 的 key 才稳定
      - name: Keep only the pinned toolchain (stable cache key)
        shell: pwsh
        env:
          PINNED: ${{ steps.rust.outputs.channel }}
        run: |
          rustup toolchain list | ForEach-Object {
            $tc = ($_ -split '\s+')[0]
            if ($tc -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*-[A-Za-z0-9._-]+$') { return }
            if ($tc -like "$env:PINNED*" -or $tc -like "$env:PINNED-*") {
              Write-Host "keep toolchain $tc"
            } else {
              Write-Host "removing toolchain $tc"
              rustup toolchain uninstall $tc
              if ($LASTEXITCODE -ne 0) { Write-Warning "could not remove $tc" }
            }
          }
          rustup toolchain list
          rustup default
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
      - name: Install pinned pnpm
        run: npm install --global --force --no-audit --no-fund https://registry.npmjs.org/pnpm/-/pnpm-10.12.3.tgz
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # 前端构建交给 tauri build 的 beforeBuildCommand（pnpm run build:renderer），
      # 单独再跑一遍只是重复。
      - name: Build EXE
        run: pnpm tauri build --ci --no-bundle
      - uses: actions/upload-artifact@v7
        with:
          name: cc-switch-dsh-minimax-windows-x64
          path: |
            src-tauri/target/release/cc-switch.exe
            LICENSE
          if-no-files-found: error
          retention-days: 14

  # macOS：两个架构分两台机器各编一次，产出裸二进制 + .app + .dmg。
  # 打包不需要 Apple 证书：CI 里没有签名身份，Tauri 也就不会去公证。
  # 两个关键点：
  #   1) --config 覆盖 createUpdaterArtifacts。仓库配置是 true，打包时会去生成
  #      updater 的 .app.tar.gz 并要求私钥（TAURI_SIGNING_PRIVATE_KEY），我们既没有
  #      密钥，也不发布更新包（应用内更新指向的是上游 farion1231/cc-switch）。
  #   2) CI=true 时 Tauri 会给 create-dmg 传 --skip-jenkins，跳过 Finder 的
  #      AppleScript 排版，所以没有图形界面也能在 runner 上打出 dmg。
  build-macos:
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Read Rust toolchain
        id: rust
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.target }}
      # 同上：卸掉镜像自带的 toolchain，rust-cache 的 key 才稳定
      - name: Keep only the pinned toolchain (stable cache key)
        shell: bash
        env:
          PINNED: ${{ steps.rust.outputs.channel }}
        run: |
          rustup toolchain list | awk '{print $1}' \
            | grep -E '^[A-Za-z0-9][A-Za-z0-9._-]*-[A-Za-z0-9._-]+$' \
            | while read -r tc; do
                case "$tc" in
                  "$PINNED"|"$PINNED".*|"$PINNED"-*) echo "keep toolchain $tc" ;;
                  *) echo "removing toolchain $tc"; rustup toolchain uninstall "$tc" || true ;;
                esac
              done
          rustup toolchain list
          rustup default
      # 缓存 key 里带上 target：两个架构共用 src-tauri/target，不区分会互相覆盖
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          key: macos-${{ matrix.target }}
      - name: Install pinned pnpm
        run: npm install --global --force --no-audit --no-fund https://registry.npmjs.org/pnpm/-/pnpm-10.12.3.tgz
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build macOS binary
        run: pnpm tauri build --ci --target ${{ matrix.target }} --no-bundle
      - name: Bundle macOS .app
        run: pnpm tauri bundle --ci --target ${{ matrix.target }} --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
      # tauri 打 dmg 时会把 .app 挪进 dmg 再删掉 bundle/macos 下的源目录，
      # 所以先自己留一份副本，后面的暂存步骤用它来出 .app.zip 和兜底 dmg。
      - name: Keep a copy of the .app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/CC Switch.app"
          if [ ! -d "$APP" ]; then
            echo "::error::missing .app bundle at $APP"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/app-bundle"
          ditto "$APP" "$RUNNER_TEMP/app-bundle/CC Switch.app"
          ls -la "$RUNNER_TEMP/app-bundle/CC Switch.app"
      # dmg 单独一步且允许失败：万一 create-dmg 在 runner 上出问题，
      # 下面的暂存步骤会用 hdiutil 兜底出一个朴素但可用的 dmg。
      - name: Bundle macOS .dmg
        continue-on-error: true
        run: pnpm tauri bundle --ci --target ${{ matrix.target }} --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Stage macOS release assets
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          BUNDLE_DIR="src-tauri/target/$TARGET/release/bundle"
          APP="$RUNNER_TEMP/app-bundle/CC Switch.app"
          OUT="release-assets"
          mkdir -p "$OUT"

          if [ ! -d "$APP" ]; then
            echo "::error::missing .app bundle at $APP"
            exit 1
          fi

          DMG="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' -type f 2>/dev/null | head -1 || true)"
          if [ -z "$DMG" ]; then
            echo "::warning::Tauri did not produce a dmg, falling back to hdiutil"
            STAGE="$RUNNER_TEMP/dmg-stage"
            rm -rf "$STAGE"
            mkdir -p "$STAGE"
            ditto "$APP" "$STAGE/CC Switch.app"
            ln -s /Applications "$STAGE/Applications"
            hdiutil create -volname "CC Switch" -srcfolder "$STAGE" -ov -format UDZO \
              "$OUT/cc-switch-dsh-minimax-macos-$TARGET.dmg"
          else
            echo "using tauri dmg: $DMG"
            cp "$DMG" "$OUT/cc-switch-dsh-minimax-macos-$TARGET.dmg"
          fi

          # .app 打成 zip（ditto 保留可执行权限和符号链接，普通 zip 会丢）
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "$OUT/cc-switch-dsh-minimax-macos-$TARGET.app.zip"
          cp "src-tauri/target/$TARGET/release/cc-switch" "$OUT/cc-switch"
          cp LICENSE README.md "$OUT/"
          ls -la "$OUT"
      - uses: actions/upload-artifact@v7
        with:
          name: cc-switch-dsh-minimax-macos-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
