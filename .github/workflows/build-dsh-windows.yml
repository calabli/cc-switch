name: Build Harness usage (Windows + macOS)
on:
  workflow_dispatch:
  push:
    branches: ["codex/dsh-usage"]
permissions:
  contents: read
concurrency:
  group: harness-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # 回归测试单独一个 job，和构建并行跑。
  # 原来测试排在 release 构建前面串行，缓存命中后也要白等 3.5 分钟（主 crate 的
  # debug 编译）。拆开后墙钟从 test+build 变成 max(test, build)。
  # 这个 job 纯 Rust，不需要 node/pnpm：beforeBuildCommand 是 tauri CLI 负责的，
  # cargo test 不会调用它（run #3 验证过：dist/ 不存在也能跑通）。
  test:
    name: Usage importer regression tests
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read Rust toolchain
        id: rust
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      # rust-cache 把「已安装的所有 toolchain」的版本号和 commit 哈希一起算进缓存 key。
      # runner 镜像自带的那个 stable 一变（实测 1.99.1 → 1.99.0），key 就跟着变，
      # 缓存永远 miss，741 个依赖每次全量重编。仓库只锁了 rust-toolchain.toml 里
      # 的那一个版本，其余的都卸掉，key 才会稳定。
      - name: Keep only the pinned toolchain (stable cache key)
        shell: bash
        env:
          PINNED: ${{ steps.rust.outputs.channel }}
        run: |
          rustup toolchain list | awk '{print $1}' \
            | grep -E '^[A-Za-z0-9][A-Za-z0-9._-]*-[A-Za-z0-9._-]+$' \
            | while read -r tc; do
                case "$tc" in
                  # 锁定的 channel 可能以版本号形式装成 1.95.0-x86_64-…，也可能是
                  # 1.95-x86_64-… 或 stable-x86_64-…，三种都要认。
                  "$PINNED"|"$PINNED".*|"$PINNED"-*) echo "keep toolchain $tc" ;;
                  *) echo "removing toolchain $tc"; rustup toolchain uninstall "$tc" || true ;;
                esac
              done
          rustup toolchain list
          rustup default
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
      # 一次编译跑完所有 session_usage_* 模块的测试：过滤串 session_usage_ 同时覆盖
      # session_usage_dsh / session_usage_mcode（原来分两条命令，各编一遍主 crate），
      # 也顺带覆盖 agy/codex/gemini/grokbuild/kimi/opencode/pi 这些模块。
      # 不加 --release：上游 ci.yml 的 nextest ci profile 用的就是 debug profile，
      # 而这几个测试本身只跑 0.02 秒，release 编译纯属浪费十几分钟。
      - name: Run usage importer tests
        shell: bash
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib session_usage_

  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Read Rust toolchain
        id: rust
        run: |
          $taskMatch = Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"'
          if (-not $taskMatch) { throw 'Rust version missing' }
          "channel=$($taskMatch.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      # 同上：只留锁定的 toolchain，rust-cache 的 key 才稳定
      - name: Keep only the pinned toolchain (stable cache key)
        shell: pwsh
        env:
          PINNED: ${{ steps.rust.outputs.channel }}
        run: |
          rustup toolchain list | ForEach-Object {
            $tc = ($_ -split '\s+')[0]
            if ($tc -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*-[A-Za-z0-9._-]+$') { return }
            if ($tc -like "$env:PINNED*" -or $tc -like "$env:PINNED-*") {
              Write-Host "keep toolchain $tc"
            } else {
              Write-Host "removing toolchain $tc"
              rustup toolchain uninstall $tc
              if ($LASTEXITCODE -ne 0) { Write-Warning "could not remove $tc" }
            }
          }
          rustup toolchain list
          rustup default
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
      - name: Install pinned pnpm
        run: npm install --global --force --no-audit --no-fund https://registry.npmjs.org/pnpm/-/pnpm-10.12.3.tgz
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # 前端构建交给 tauri build 的 beforeBuildCommand（pnpm run build:renderer），
      # 单独再跑一遍只是重复。
      - name: Build EXE
        run: pnpm tauri build --ci --no-bundle
      # Windows 的更新包是安装程序（上游也用 MSI）：tauri updater 下载它做静默更新。
      # createUpdaterArtifacts 在 tauri.conf.json 里已经是 true，所以这里会同时
      # 生成 .msi 和 .msi.sig（用 TAURI_SIGNING_PRIVATE_KEY 签名）。
      # 签名私钥要先规范化成 base64：Tauri 的 decode_key 是对整个环境变量做
      # base64 解码，直接塞两行原文会解不开。
      - uses: ./.github/actions/prepare-tauri-signing-key
        with:
          private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Bundle Windows MSI (updater package)
        run: pnpm tauri bundle --ci --bundles msi
      - name: Stage Windows release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item 'src-tauri/target/release/cc-switch.exe' 'release-assets/cc-switch.exe'

          $msi = Get-ChildItem -Path 'src-tauri/target/release/bundle/msi' -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            throw 'MSI not found under src-tauri/target/release/bundle/msi'
          }
          $sig = "$($msi.FullName).sig"
          if (-not (Test-Path $sig)) {
            throw "MSI signature not found: $sig"
          }
          Copy-Item $msi.FullName 'release-assets/'
          Copy-Item $sig 'release-assets/'
          Copy-Item 'LICENSE' 'release-assets/'
          Copy-Item 'README.md' 'release-assets/'
          Get-ChildItem release-assets | Select-Object Name, Length | Format-Table
      - uses: actions/upload-artifact@v7
        with:
          name: cc-switch-dsh-minimax-windows-x64
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  # macOS：两个架构分两台机器各编一次，产出裸二进制 + .app + .dmg。
  # 打包不需要 Apple 证书：CI 里没有签名身份，Tauri 也就不会去公证。
  # 两个关键点：
  #   1) --config 覆盖 createUpdaterArtifacts。仓库配置是 true，打包时会去生成
  #      updater 的 .app.tar.gz 并要求私钥（TAURI_SIGNING_PRIVATE_KEY），我们既没有
  #      密钥，也不发布更新包（应用内更新指向的是上游 farion1231/cc-switch）。
  #   2) CI=true 时 Tauri 会给 create-dmg 传 --skip-jenkins，跳过 Finder 的
  #      AppleScript 排版，所以没有图形界面也能在 runner 上打出 dmg。
  build-macos:
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Read Rust toolchain
        id: rust
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.target }}
      # 同上：卸掉镜像自带的 toolchain，rust-cache 的 key 才稳定
      - name: Keep only the pinned toolchain (stable cache key)
        shell: bash
        env:
          PINNED: ${{ steps.rust.outputs.channel }}
        run: |
          rustup toolchain list | awk '{print $1}' \
            | grep -E '^[A-Za-z0-9][A-Za-z0-9._-]*-[A-Za-z0-9._-]+$' \
            | while read -r tc; do
                case "$tc" in
                  "$PINNED"|"$PINNED".*|"$PINNED"-*) echo "keep toolchain $tc" ;;
                  *) echo "removing toolchain $tc"; rustup toolchain uninstall "$tc" || true ;;
                esac
              done
          rustup toolchain list
          rustup default
      # 缓存 key 里带上 target：两个架构共用 src-tauri/target，不区分会互相覆盖
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          key: macos-${{ matrix.target }}
      - name: Install pinned pnpm
        run: npm install --global --force --no-audit --no-fund https://registry.npmjs.org/pnpm/-/pnpm-10.12.3.tgz
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build macOS binary
        run: pnpm tauri build --ci --target ${{ matrix.target }} --no-bundle
      # APPLE_SIGNING_IDENTITY="-" 让 Tauri 用 codesign --sign - 做 ad-hoc 签名。
      # 关键：签名发生在 Tauri 生成 .app.tar.gz（updater 包）之前，所以 updater
      # 包里的 app 也是签过名的 —— 否则应用内更新完又会变成「应用已损坏」。
      # 没有 Apple 证书和公证，notarize_auth() 找不到凭据只会 warning 跳过。
      # 签名私钥要先规范化成 base64：Tauri 的 decode_key 是对整个环境变量做
      # base64 解码，直接塞两行原文会解不开。
      - uses: ./.github/actions/prepare-tauri-signing-key
        with:
          private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Bundle macOS .app (+ updater package)
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri bundle --ci --target ${{ matrix.target }} --bundles app
      # tauri 打 dmg 时会把 .app 挪走，所以下面用自己留的副本来打 dmg。
      - name: Keep a copy of the .app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/CC Switch.app"
          if [ ! -d "$APP" ]; then
            echo "::error::missing .app bundle at $APP"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/app-bundle"
          ditto "$APP" "$RUNNER_TEMP/app-bundle/CC Switch.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/app-bundle/CC Switch.app"
          codesign -dv "$RUNNER_TEMP/app-bundle/CC Switch.app" 2>&1 | head -8
      # 自己用 hdiutil 打 DMG，不用 tauri 自带的 create-dmg：
      # create-dmg 在 CI 上（--skip-jenkins）打出来的镜像里，.app 会丢掉
      # Contents/Resources，codesign --verify 会判定「bundle 签名损坏」，
      # 用户打开就是「应用已损坏」。这里从已签名的 .app 直接做目录镜像，
      # 内容完全可控。
      - name: Build macOS .dmg
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          APP="$RUNNER_TEMP/app-bundle/CC Switch.app"
          STAGE="$RUNNER_TEMP/dmg-stage"
          OUT="release-assets"
          DMG="$OUT/cc-switch-dsh-minimax-macos-$TARGET.dmg"

          if [ ! -d "$APP" ]; then
            echo "::error::missing signed .app at $APP"
            exit 1
          fi
          rm -rf "$STAGE"
          mkdir -p "$STAGE" "$OUT"
          # ditto 会保留 _CodeSignature、权限和符号链接
          ditto "$APP" "$STAGE/CC Switch.app"
          ln -s /Applications "$STAGE/Applications"
          cp src-tauri/icons/icon.icns "$STAGE/.VolumeIcon.icns"
          find "$STAGE" -maxdepth 3 | sed "s#$STAGE#.#"

          if ! hdiutil create -volname "CC Switch" -srcfolder "$STAGE" -fs HFS+ \
               -fsargs "-c c=64,a=16,e=16" -format UDZO -ov "$DMG"; then
            echo "::warning::hdiutil with fsargs failed, retrying with defaults"
            hdiutil create -volname "CC Switch" -srcfolder "$STAGE" -format UDZO -ov "$DMG"
          fi
          ls -la "$DMG"
      - name: Stage macOS release assets
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          BUNDLE_DIR="src-tauri/target/$TARGET/release/bundle"
          APP="$RUNNER_TEMP/app-bundle/CC Switch.app"
          OUT="release-assets"
          mkdir -p "$OUT"

          if [ ! -d "$APP" ]; then
            echo "::error::missing .app bundle at $APP"
            exit 1
          fi
          if [ ! -f "$OUT/cc-switch-dsh-minimax-macos-$TARGET.dmg" ]; then
            echo "::error::missing dmg"
            exit 1
          fi

          # updater 包：.app.tar.gz + .sig。latest.json 里 darwin-* 指向它。
          UPDATER="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app.tar.gz' -type f 2>/dev/null | head -1 || true)"
          if [ -z "$UPDATER" ]; then
            echo "::error::missing updater artifact ($BUNDLE_DIR/macos/*.app.tar.gz)"
            exit 1
          fi
          if [ ! -f "$UPDATER.sig" ]; then
            echo "::error::missing updater signature $UPDATER.sig"
            exit 1
          fi
          cp "$UPDATER" "$OUT/cc-switch-dsh-minimax-macos-$TARGET.tar.gz"
          cp "$UPDATER.sig" "$OUT/cc-switch-dsh-minimax-macos-$TARGET.tar.gz.sig"

          # .app 打成 zip（ditto 保留可执行权限和符号链接，普通 zip 会丢）
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "$OUT/cc-switch-dsh-minimax-macos-$TARGET.app.zip"
          cp "src-tauri/target/$TARGET/release/cc-switch" "$OUT/cc-switch"
          cp LICENSE README.md "$OUT/"
          ls -la "$OUT"
      # 把 dmg 挂载起来看一眼：确认它真能挂、里面有 .app 和 Applications 软链，
      # 并且 .app 里的二进制架构和目标一致。发出去的 dmg 必须是能用的。
      - name: Verify the dmg and the app bundle
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          OUT="release-assets"
          DMG="$OUT/cc-switch-dsh-minimax-macos-$TARGET.dmg"
          MNT="$RUNNER_TEMP/dmg-mount"
          cleanup() { hdiutil detach "$MNT" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          rm -rf "$MNT"
          mkdir -p "$MNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          ls -la "$MNT"
          if [ ! -d "$MNT/CC Switch.app" ]; then
            echo "::error::CC Switch.app is missing inside the dmg"
            exit 1
          fi
          if [ ! -e "$MNT/Applications" ]; then
            echo "::error::Applications symlink is missing inside the dmg"
            exit 1
          fi
          echo "--- dmg 内 .app 的完整结构 ---"
          find "$MNT/CC Switch.app" | sed "s#$MNT/##" | sort
          # bundle 必须完整：Info.plist、Resources、_CodeSignature 一个都不能少，
          # 少任何一个 codesign 都会判定签名损坏，用户看到的就是「应用已损坏」。
          for required in \
            "Contents/Info.plist" \
            "Contents/Resources" \
            "Contents/MacOS/cc-switch" \
            "Contents/_CodeSignature"; do
            if [ ! -e "$MNT/CC Switch.app/$required" ]; then
              echo "::error::$required is missing inside the dmg's .app"
              exit 1
            fi
          done
          file "$MNT/CC Switch.app/Contents/MacOS/cc-switch"
          codesign --verify --deep --strict --verbose=2 "$MNT/CC Switch.app"
          codesign -dv "$MNT/CC Switch.app" 2>&1 | head -8

          rm -rf "$RUNNER_TEMP/appzip"
          mkdir -p "$RUNNER_TEMP/appzip"
          ditto -x -k "$OUT/cc-switch-dsh-minimax-macos-$TARGET.app.zip" "$RUNNER_TEMP/appzip"
          echo "--- app.zip 解开后的结构 ---"
          find "$RUNNER_TEMP/appzip/CC Switch.app" | sed "s#$RUNNER_TEMP/appzip/##" | sort
          for required in \
            "Contents/Info.plist" \
            "Contents/Resources" \
            "Contents/MacOS/cc-switch" \
            "Contents/_CodeSignature"; do
            if [ ! -e "$RUNNER_TEMP/appzip/CC Switch.app/$required" ]; then
              echo "::error::$required is missing inside the app.zip"
              exit 1
            fi
          done
          if [ ! -x "$RUNNER_TEMP/appzip/CC Switch.app/Contents/MacOS/cc-switch" ]; then
            echo "::error::app.zip does not contain an executable cc-switch"
            exit 1
          fi
          codesign --verify --deep --strict "$RUNNER_TEMP/appzip/CC Switch.app"
          file "$RUNNER_TEMP/appzip/CC Switch.app/Contents/MacOS/cc-switch"
          codesign -dv "$RUNNER_TEMP/appzip/CC Switch.app" 2>&1 | head -8

          # updater 包里的 app 也必须是签过名的，否则应用内更新完又会「已损坏」
          rm -rf "$RUNNER_TEMP/updater"
          mkdir -p "$RUNNER_TEMP/updater"
          tar -xzf "$OUT/cc-switch-dsh-minimax-macos-$TARGET.tar.gz" -C "$RUNNER_TEMP/updater"
          echo "--- updater 包里的结构 ---"
          find "$RUNNER_TEMP/updater" -maxdepth 3 | sed "s#$RUNNER_TEMP/updater/##" | sort
          if [ ! -d "$RUNNER_TEMP/updater/CC Switch.app/Contents/_CodeSignature" ]; then
            echo "::error::the app inside the updater package is not signed"
            exit 1
          fi
          codesign --verify --deep --strict "$RUNNER_TEMP/updater/CC Switch.app"
          codesign -dv "$RUNNER_TEMP/updater/CC Switch.app" 2>&1 | head -8
      - uses: actions/upload-artifact@v7
        with:
          name: cc-switch-dsh-minimax-macos-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
